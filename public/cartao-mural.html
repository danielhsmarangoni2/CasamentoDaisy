<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code do mural | Daisy e Vinícius</title><link rel="stylesheet" href="styles.css"><script src="qr-local.js" defer></script><style>
body{background:#faf0f5;padding:24px;font-family:'DM Sans',sans-serif;color:#4f243b}.print-card{max-width:490px;min-height:660px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px auto;padding:46px 35px;text-align:center;border:5px double #c5a16e;outline:10px solid #fff;box-shadow:0 10px 35px #69213c19}.print-card h1{font-family:'Playfair Display',Georgia,serif;font-size:2.9rem;color:#a92360;font-weight:500;margin:8px}.print-card h1 em{color:#a92360}.print-card .caption{letter-spacing:.2em;font-size:.72rem;color:#9b4473;font-weight:700}.print-card .subtitle{line-height:1.6;color:#654a57}.print-card .footer{font-size:1rem;font-weight:700;color:#7c3d5b;margin-top:23px}.print-card #qr{margin:24px 0;min-height:210px;min-width:210px}.print-card #qr svg{width:210px;height:210px}.print-btn{display:block;margin:16px auto;padding:13px 26px;background:#a92360;border:0;border-radius:12px;color:white;font-weight:700}.warning{text-align:center;font-size:.8rem;color:#7c5c6b;max-width:500px;margin:15px auto}
@media print{body{background:#fff;padding:0}.print-card{box-shadow:none;margin:0 auto;outline:none;border:5px double #c5a16e}.print-btn,.warning{display:none}} </style></head><body><main class="print-card"><span class="caption">O NOSSO GRANDE DIA</span><h1>Daisy <em>&</em> Vinícius</h1><p class="subtitle">Registre os melhores momentos do casamento! Escaneie o QR Code e compartilhe suas fotos e mensagens conosco.</p><div id="qr"></div><p class="footer">23 · 05 · 2027</p><p class="caption">MANSÃO VICTÓRIA · SÃO PAULO</p></main><button class="print-btn" onclick="print()">Imprimir para as mesas</button><p class="warning" id="warning">O QR Code usará o endereço definitivo do site publicado. Não imprima a versão aberta como arquivo local.</p><script>document.addEventListener('DOMContentLoaded',()=>{const target=location.origin+'/#mural';if(location.protocol==='file:'){document.getElementById('warning').textContent='Publique o site antes de imprimir: este endereço local ainda não funciona para os convidados.';return;}try{window.WeddingQR.render(document.getElementById('qr'),target)}catch{document.getElementById('warning').textContent='Não foi possível gerar o QR Code.'}});</script></body></html>
